# kol-monitor-api — the one D1 binding this app has (plan 13 W7, 2026-10-15 — kol-mirror's of 2026-10-14).
# The app deploys on Vercel and cannot hold a D1 binding; this Worker is the API beside it.
# Deploy: `pnpm api:deploy`. Local: `pnpm dev` (app + Worker) or `pnpm api:dev`, on 8789.
#
# FIRST DEPLOY — done 2026-10-15 by the agent (steps kept for a rebuild; the password is mirror's, 3341):
#   1. pnpm exec wrangler d1 create kol-monitor        → paste its database_id below
#   2. pnpm api:schema                                  → the table on the real D1
#   3. pnpm exec wrangler secret put ADMIN_PASSWORD --config api/wrangler.toml
#   4. pnpm api:deploy                                  → monitor-api.kolkrabbi.io
#   5. Vercel env VITE_MONITOR_API=https://monitor-api.kolkrabbi.io, then redeploy the app
name = "kol-monitor-api"
main = "src/index.js"
compatibility_date = "2026-10-06"

# the custom domain — wrangler creates the DNS record on the kolkrabbi.io zone on deploy
routes = [{ pattern = "monitor-api.kolkrabbi.io", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "kol-monitor"
# created 2026-10-15 (`wrangler d1 create kol-monitor`)
database_id = "55d0a625-e8c9-4c27-9b25-aa266842851d"

[vars]
# browser origins allowed to call this API — localhost and 127.0.0.1 on any port are always allowed
ALLOWED_ORIGINS = "https://monitor.kolkrabbi.io,https://kol-monitor-six.vercel.app"
# ADMIN_PASSWORD is a secret: `pnpm exec wrangler secret put ADMIN_PASSWORD --config api/wrangler.toml`; locally api/.dev.vars
