<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- LFO module (+15) -->
<rect x="30" y="85" width="50" height="100" rx="2" stroke="currentColor" stroke-width="1"/>
<!-- Sine screen -->
<rect x="36" y="93" width="38" height="24" rx="2" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
<!-- Sine wave inside screen -->
<path d="M40 105C44 97 50 97 55 105C60 113 66 113 70 105" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
<!-- LFO output jack -->
<circle cx="55" cy="165" r="5" stroke="currentColor" stroke-width="1"/>
<circle cx="55" cy="165" r="2" fill="currentColor"/>
<!-- Cable from LFO to knob CV -->
<path d="M60 165C100 165 110 115 140 115" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
<!-- Target module (-15) -->
<rect x="130" y="55" width="80" height="100" rx="2" stroke="currentColor" stroke-width="1"/>
<!-- CV input jack on target -->
<circle cx="145" cy="115" r="5" stroke="currentColor" stroke-width="1"/>
<circle cx="145" cy="115" r="2" fill="currentColor"/>
<!-- Knob being modulated -->
<circle cx="180" cy="95" r="12" stroke="currentColor" stroke-width="1"/>
<!-- Knob indicator line (animated position) -->
<line x1="180" y1="95" x2="180" y2="85" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
<!-- Modulation indicator dot -->
<circle cx="180" cy="81" r="2" fill="currentColor"/>
<!-- Clock module small (+15) -->
<rect x="43" y="200" width="24" height="14" rx="2" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<text x="55" y="210" font-size="7" fill="currentColor" opacity="0.4" font-family="monospace" text-anchor="middle">CLK</text>
<!-- Clock arrow to LFO -->
<path d="M55 200L55 185" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" stroke-dasharray="3 2"/>
<!-- Sync label on right module (-15) -->
<rect x="153" y="170" width="28" height="14" rx="2" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<text x="167" y="180" font-size="7" fill="currentColor" opacity="0.4" font-family="monospace" text-anchor="middle">SYNC</text>
<!-- Sync dashed line to right module -->
<path d="M167 170L167 155" stroke="currentColor" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" stroke-dasharray="3 2"/>
</svg>
