<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Monitor module frame -->
<rect x="50" y="40" width="140" height="160" rx="2" stroke="currentColor" stroke-width="1"/>
<!-- Screen area -->
<rect x="60" y="52" width="120" height="100" rx="2" stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>
<!-- Wireframe shape on screen (cube-like) -->
<path d="M90 90L120 72L150 90L150 112L120 130L90 112Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
<line x1="120" y1="72" x2="120" y2="95" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<line x1="90" y1="90" x2="120" y2="95" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<line x1="150" y1="90" x2="120" y2="95" stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
<!-- Grid lines on screen -->
<line x1="60" y1="102" x2="180" y2="102" stroke="currentColor" stroke-width="1" stroke-opacity="0.15"/>
<line x1="120" y1="52" x2="120" y2="152" stroke="currentColor" stroke-width="1" stroke-opacity="0.15"/>
<!-- Pen input jack -->
<circle cx="75" cy="178" r="5" stroke="currentColor" stroke-width="1"/>
<circle cx="75" cy="178" r="2" fill="currentColor"/>
<!-- Label -->
<text x="86" y="181" font-size="7" fill="currentColor" opacity="0.4" font-family="monospace">PEN</text>
<!-- Signal input jack -->
<circle cx="145" cy="178" r="5" stroke="currentColor" stroke-width="1"/>
<circle cx="145" cy="178" r="2" fill="currentColor"/>
<!-- Label -->
<text x="155" y="181" font-size="7" fill="currentColor" opacity="0.4" font-family="monospace">IN</text>
<!-- Module labels inside -->
<text x="70" y="195" font-size="7" fill="currentColor" opacity="0.3" font-family="monospace">MON</text>
<text x="108" y="195" font-size="7" fill="currentColor" opacity="0.3" font-family="monospace">SCP</text>
<text x="146" y="195" font-size="7" fill="currentColor" opacity="0.3" font-family="monospace">OUT</text>
</svg>
